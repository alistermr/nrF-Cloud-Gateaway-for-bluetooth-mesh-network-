cmake:
  application:
    source-dir: 'C:/ncs/v3.2.4/zephyr/share/sysbuild'
  board:
    name: 'nrf54l15dk'
    path:
     - 'C:/ncs/v3.2.4/zephyr/boards/nordic/nrf54l15dk'
    qualifiers: 'nrf54l15/cpuapp/ns'
    revision: ''
  images:
   - name: 'UART-Gateaway'
     source-dir: 'C:/ba/nrfGateaway/UART-Gateaway'
     type: 'MAIN'
  kconfig:
    files:
     - 'C:/ba/nrfGateaway/UART-Gateaway/build/_sysbuild/empty.conf'
     - 'c:/ba/nrfGateaway/UART-Gateaway/sysbuild.conf'
    user-files:
     - 'c:/ba/nrfGateaway/UART-Gateaway/sysbuild.conf'
  sysbuild: 'true'
version: '0.1.0'
west:
  command: 'C:\ncs\toolchains\fd21892d0f\opt\bin\Scripts\west build --build-dir c:/ba/nrfGateaway/UART-Gateaway/build c:/ba/nrfGateaway/UART-Gateaway --pristine --board nrf54l15dk/nrf54l15/cpuapp/ns -- -DDEBUG_THREAD_INFO=On -DCONFIG_DEBUG_THREAD_INFO=y -DUART-Gateaway_DEBUG_THREAD_INFO=On'
  topdir: 'c:\ncs\v3.2.4'
  version: '1.4.0'
